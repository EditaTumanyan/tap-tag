# Nginx config for taptag.am (Next.js app run via pm2 on port 3033)
# TLS is a Cloudflare Origin Certificate (edge <-> origin), with
# Cloudflare's SSL/TLS mode set to "Full (strict)".
#
# Install:
#   sudo cp nginx/taptag.am.conf /etc/nginx/sites-available/taptag.am.conf
#   sudo ln -s /etc/nginx/sites-available/taptag.am.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# See the "Cloudflare Origin Certificate" steps at the bottom of this
# file for how to generate/install /etc/nginx/ssl/taptag.am/*.pem

upstream taptag_app {
    server 127.0.0.1:3033;
    keepalive 64;
}

# Restore real visitor IP from Cloudflare's CF-Connecting-IP header
# (requires the ngx_http_realip_module, built into stock nginx).
# IP ranges from https://www.cloudflare.com/ips/ — update if Cloudflare changes them.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2c0f:f248::/32;
set_real_ip_from 2a06:98c0::/29;
real_ip_header CF-Connecting-IP;

# Plain HTTP -> HTTPS (also covers Cloudflare "Flexible" mode fallback)
server {
    listen 80;
    listen [::]:80;
    server_name taptag.am www.taptag.am;
    return 301 https://taptag.am$request_uri;
}

# Redirect www -> apex (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.taptag.am;

    ssl_certificate     /etc/nginx/ssl/taptag.am/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/taptag.am/key.pem;

    return 301 https://taptag.am$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taptag.am;

    ssl_certificate     /etc/nginx/ssl/taptag.am/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/taptag.am/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Next.js static build assets (immutable, long cache)
    location /_next/static/ {
        proxy_pass http://taptag_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /assets/ {
        proxy_pass http://taptag_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://taptag_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# --- Cloudflare Origin Certificate: setup steps ---
#
# 1. In the Cloudflare dashboard, select the taptag.am zone, then go to
#    SSL/TLS -> Origin Server -> "Create Certificate".
#    - Keep "Let Cloudflare generate a private key and a CSR" (RSA 2048).
#    - Hostnames: taptag.am, *.taptag.am
#    - Validity: 15 years is fine for an origin cert.
#    - Click "Create" — Cloudflare shows the Origin Certificate and the
#      Private Key ONCE. Copy both now.
#
# 2. On the server, create the directory and paste the two files:
#      sudo mkdir -p /etc/nginx/ssl/taptag.am
#      sudo nano /etc/nginx/ssl/taptag.am/cert.pem   # paste the Origin Certificate
#      sudo nano /etc/nginx/ssl/taptag.am/key.pem    # paste the Private Key
#      sudo chmod 600 /etc/nginx/ssl/taptag.am/key.pem
#      sudo chmod 644 /etc/nginx/ssl/taptag.am/cert.pem
#
# 3. Test and reload nginx:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4. In Cloudflare, set SSL/TLS -> Overview -> encryption mode to
#    "Full (strict)". This makes Cloudflare validate this origin cert
#    on every request instead of accepting any/no certificate.
#
# 5. Make sure DNS records for taptag.am and www.taptag.am are
#    proxied (orange cloud) in Cloudflare, so traffic actually flows
#    through the edge and this origin cert is used.
#
# Note: this is NOT a publicly trusted certificate — it is only valid
# for Cloudflare <-> origin traffic and will show as untrusted if you
# bypass Cloudflare and hit the server's IP directly. That's expected.
